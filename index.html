<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh bạ NFC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#12161d;
    --panel:#1a212b;
    --panel-2:#212a36;
    --card:#eee7d6;
    --card-shade:#e2d9c2;
    --brass:#b8925e;
    --brass-light:#d9b988;
    --text:#e7e2d4;
    --text-muted:#8b93a1;
    --ink-on-card:#2a2620;
    --ok:#7fae8f;
    --radius:14px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #1e2733 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #1c2530 0%, transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:48px 20px 80px;
  }

  a{color:inherit;}

  .wrap{max-width:760px;margin:0 auto;}

  header.top{margin-bottom:36px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass-light);
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brass-light);
    box-shadow:0 0 0 0 rgba(217,185,136,.6);animation:pulse 2.2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(217,185,136,.45);}
    70%{box-shadow:0 0 0 10px rgba(217,185,136,0);}
    100%{box-shadow:0 0 0 0 rgba(217,185,136,0);}
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px,5vw,38px);
    margin:10px 0 4px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--text-muted);font-size:14.5px;}

  .searchbar{
    margin-top:24px;
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:1px solid #2a3341;
    border-radius:10px;
    padding:12px 14px;
  }
  .searchbar svg{flex:0 0 auto;opacity:.55;}
  .searchbar input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text);font-family:var(--sans);font-size:15px;
  }
  .searchbar input::placeholder{color:var(--text-muted);}

  .count{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-muted);
    margin:18px 2px 10px;
    letter-spacing:.05em;
    text-transform:uppercase;
  }

  .list{
    display:flex;flex-direction:column;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid #2a3341;
  }

  .row{
    display:flex;align-items:center;gap:14px;
    padding:15px 16px;
    background:var(--panel);
    border-bottom:1px solid #242c38;
    cursor:pointer;
    transition:background .15s ease;
    text-align:left;
    width:100%;
    color:var(--text);
    font-family:inherit;
  }
  .row:last-child{border-bottom:none;}
  .row:hover, .row:focus-visible{background:var(--panel-2);}
  .row:focus-visible{outline:2px solid var(--brass-light);outline-offset:-2px;}

  .tab{
    flex:0 0 40px;height:40px;border-radius:8px;
    background:linear-gradient(155deg,var(--brass-light),var(--brass));
    color:#241d10;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:600;font-size:16px;
  }
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:15.5px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{font-size:12.5px;color:var(--text-muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-arrow{opacity:.4;flex:0 0 auto;}

  .empty, .loading, .error{
    padding:40px 16px;text-align:center;color:var(--text-muted);
    font-size:14px;border-radius:var(--radius);border:1px dashed #2a3341;
  }
  .error{color:#d98b7f;}

  /* Modal */
  .backdrop{
    position:fixed;inset:0;background:rgba(9,11,15,.72);
    backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .backdrop.open{display:flex;}

  .cardmodal{
    width:100%;max-width:420px;
    background:linear-gradient(160deg,var(--card),var(--card-shade));
    color:var(--ink-on-card);
    border-radius:16px;
    padding:28px 26px 24px;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    animation:tapin .32s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes tapin{
    0%{opacity:0;transform:translateY(14px) scale(.97);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .notch{
    position:absolute;left:-1px;top:26px;width:16px;height:46px;
    background:var(--ink);border-radius:0 8px 8px 0;
  }
  .close-btn{
    position:absolute;top:14px;right:14px;
    width:30px;height:30px;border-radius:50%;
    border:none;background:rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-on-card);
  }
  .close-btn:hover{background:rgba(0,0,0,.15);}

  .m-eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--brass);
  }
  .m-name{font-family:var(--serif);font-weight:600;font-size:26px;margin:6px 0 2px;line-height:1.15;}
  .m-title{font-size:14px;color:#5c5540;}
  .m-company{font-size:13.5px;color:#5c5540;margin-top:2px;}

  .divider{height:1px;background:rgba(42,38,32,.15);margin:18px 0 14px;}

  .field{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;}
  .field svg{flex:0 0 auto;opacity:.65;}
  .field a{text-decoration:none;font-family:var(--mono);font-size:13.5px;}
  .field a:hover{text-decoration:underline;}

  .actions{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 14px;border-radius:10px;border:none;cursor:pointer;
    font-family:var(--sans);font-weight:600;font-size:13.5px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:#241d10;color:var(--card);}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:rgba(0,0,0,.08);color:var(--ink-on-card);}
  .btn-ghost:hover{background:rgba(0,0,0,.14);}
  .btn.copied{background:var(--ok);color:#0e1f16;}

  .id-tag{
    position:absolute;bottom:16px;right:20px;
    font-family:var(--mono);font-size:10.5px;color:#8a8266;letter-spacing:.05em;
  }

  @media (max-width:480px){
    body{padding:32px 14px 60px;}
    .row{padding:13px 12px;gap:11px;}
    .tab{width:36px;height:36px;font-size:14px;}
  }

  @media (prefers-reduced-motion: reduce){
    .cardmodal{animation:none;}
    .eyebrow .dot{animation:none;}
  }

  /* Toast thông báo tải VCF */
  .toast{
    position:fixed;left:50%;bottom:28px;
    transform:translateX(-50%) translateY(12px);
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);
    border:1px solid #34405290;
    color:var(--text);
    padding:12px 16px;border-radius:12px;
    font-size:13.5px;
    box-shadow:0 20px 40px -14px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:60;max-width:min(360px, calc(100vw - 32px));
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .toast-icon{
    flex:0 0 22px;width:22px;height:22px;border-radius:50%;
    background:var(--ok);color:#0e1f16;
    display:flex;align-items:center;justify-content:center;
  }
  .toast .toast-text b{color:var(--brass-light);}

  @media (prefers-reduced-motion: reduce){
    .toast{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap" id="directoryView">
  <header class="top">
    <div class="eyebrow"><span class="dot"></span>Danh bạ · Tap NFC</div>
    <h1>Danh bạ liên hệ</h1>
    <div class="sub">Chạm vào một liên hệ để xem chi tiết, lưu danh thiếp hoặc lấy link NFC.</div>

    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Tìm theo tên, công ty, chức danh…">
    </div>
  </header>

  <div id="count" class="count"></div>
  <div id="listArea">
    <div class="loading">Đang tải danh bạ…</div>
  </div>
</div>

<!-- Trang tối giản chỉ hiện 1 liên hệ khi mở qua link NFC (?id=...) — không lộ danh bạ đầy đủ -->
<div class="wrap" id="sharedView" style="display:none;padding-top:60px;text-align:center;">
  <div class="eyebrow" style="justify-content:center;"><span class="dot"></span>Danh thiếp được chia sẻ</div>
</div>

<div class="backdrop" id="backdrop">
  <div class="cardmodal" id="cardmodal" role="dialog" aria-modal="true">
    <div class="notch"></div>
    <button class="close-btn" id="closeBtn" aria-label="Đóng">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    <div class="m-eyebrow" id="mEyebrow">Danh thiếp</div>
    <div class="m-name" id="mName">—</div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-company" id="mCompany"></div>

    <div class="divider"></div>

    <div id="mFields"></div>

    <div class="actions">
      <button class="btn btn-primary" id="vcfBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
        Tải VCF
      </button>
      <button class="btn btn-ghost" id="copyBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        Copy link NFC
      </button>
    </div>

    <div class="id-tag" id="mId"></div>
  </div>
</div>

<!-- Khung Toast nhỏ hiển thị trạng thái đã tải -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-icon">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
  </span>
  <span class="toast-text" id="toastText"></span>
</div>

<script>
  const SHEET_API_URL = "https://opensheet.elk.sh/1ImwCxw0HGk8bOEdJRQE_Iv5uBgbr1P79ONPVVJGcgzI/1";
  const POST_URL = "https://script.google.com/macros/s/AKfycbx6Ej9cGAzTAXpDQs-4zcVEMZErZS7AbZ631AzJ5jPlOnH9bTMFk2-ouhyu7mNvqZCb/exec";

  let contacts = [];

  const listArea = document.getElementById('listArea');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('search');
  const backdrop = document.getElementById('backdrop');

  function normalizeHeader(h){
    return h.trim().toLowerCase().replace(/\s+/g,'');
  }

  async function loadContacts(){
    try{
      const res = await fetch(SHEET_API_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!Array.isArray(data) || !data.length) throw new Error('Sheet trống hoặc chưa bật chia sẻ công khai');

      contacts = data.map(row => {
        const norm = {};
        Object.keys(row).forEach(k => { norm[normalizeHeader(k)] = row[k]; });
        const get = (...keys) => {
          for(const k of keys){ if(norm[k] !== undefined && norm[k] !== null) return String(norm[k]).trim(); }
          return '';
        };
        return {
          id: get('id'),
          lastName: get('lastname'),
          firstName: get('firstname'),
          phone: get('phone'),
          email: get('email'),
          company: get('company'),
          jobTitle: get('jobtitle', 'title'),
        };
      }).filter(c => c.id);

      // QUAN TRỌNG: nếu URL có ?id=... (mở từ link/NFC chia sẻ), KHÔNG render toàn bộ
      // danh bạ ra trang — chỉ hiện đúng 1 liên hệ được chia sẻ, tránh lộ dữ liệu người khác.
      const sharedId = new URLSearchParams(location.search).get('id');
      if(sharedId){
        renderSharedView(sharedId);
      } else {
        renderList(contacts);
      }
    } catch(err){
      listArea.innerHTML = `<div class="error">Không tải được danh bạ. Kiểm tra sheet đã bật chia sẻ "Bất kỳ ai có đường liên kết" chưa.<br><span style="font-family:var(--mono);font-size:11.5px;opacity:.8">${(err.message||'').replace(/</g,'&lt;')}</span></div>`;
      countEl.textContent = '';
    }
  }

  function fullName(c){
    return [c.firstName, c.lastName].filter(Boolean).join(' ') || c.id;
  }

  function initials(c){
    const a = (c.firstName||'')[0] || (c.lastName||'')[0] || (c.id||'?')[0];
    const b = (c.lastName||'')[0] || '';
    return (a+b).toUpperCase();
  }

  function renderList(list){
    countEl.textContent = list.length + ' liên hệ';
    if(!list.length){
      listArea.innerHTML = '<div class="empty">Không tìm thấy liên hệ nào.</div>';
      return;
    }
    const html = list.map(c => `
      <button class="row" data-id="${escapeAttr(c.id)}">
        <div class="tab">${escapeHtml(initials(c))}</div>
        <div class="row-main">
          <div class="row-name">${escapeHtml(fullName(c))}</div>
          <div class="row-meta">${escapeHtml([c.jobTitle, c.company].filter(Boolean).join(' · '))}</div>
        </div>
        <svg class="row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    `).join('');
    listArea.innerHTML = `<div class="list">${html}</div>`;

    listArea.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', () => openContact(el.dataset.id));
    });
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ renderList(contacts); return; }
    const filtered = contacts.filter(c =>
      fullName(c).toLowerCase().includes(q) ||
      (c.company||'').toLowerCase().includes(q) ||
      (c.jobTitle||'').toLowerCase().includes(q) ||
      (c.id||'').toLowerCase().includes(q)
    );
    renderList(filtered);
  });

  // ---- Modal chi tiết ----
  let currentContact = null;

  function openContact(id){
    const c = contacts.find(x => x.id === id);
    if(!c) return;
    currentContact = c;

    document.getElementById('mName').textContent = fullName(c);
    document.getElementById('mTitle').textContent = c.jobTitle || '';
    document.getElementById('mCompany').textContent = c.company || '';
    document.getElementById('mId').textContent = 'ID · ' + c.id;

    const fields = [];
    if(c.phone) fields.push(`
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>
        <a href="tel:${escapeAttr(c.phone)}">${escapeHtml(c.phone)}</a>
      </div>`);
    if(c.email) fields.push(`
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <a href="mailto:${escapeAttr(c.email)}">${escapeHtml(c.email)}</a>
      </div>`);
    document.getElementById('mFields').innerHTML = fields.join('') || '<div class="field" style="color:#8a8266">Không có thông tin liên hệ khác.</div>';

    backdrop.classList.add('open');
  }

  // ---- Toast thông báo ----
  const toastEl = document.getElementById('toast');
  const toastTextEl = document.getElementById('toastText');
  let toastTimer = null;

  function showToast(html, duration=3200){
    toastTextEl.innerHTML = html;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ---- Chế độ chia sẻ 1 liên hệ (mở qua ?id=... từ link/NFC) ----
  // Ẩn HOÀN TOÀN khu vực danh bạ đầy đủ, chỉ hiển thị đúng liên hệ được chia sẻ.
  const directoryView = document.getElementById('directoryView');
  const sharedView = document.getElementById('sharedView');

  function renderSharedView(id){
    directoryView.style.display = 'none';
    sharedView.style.display = 'block';

    const c = contacts.find(x => x.id === id);
    if(!c){
      sharedView.insertAdjacentHTML('beforeend',
        '<div class="error" style="margin-top:16px;text-align:left">Không tìm thấy liên hệ với ID này. Đường link có thể đã hết hạn hoặc không đúng.</div>');
      return;
    }

    logNfcTap(c.id);
    downloadVcf(c);

    const fields = [];
    if(c.phone) fields.push(`
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>
        <a href="tel:${escapeAttr(c.phone)}">${escapeHtml(c.phone)}</a>
      </div>`);
    if(c.email) fields.push(`
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <a href="mailto:${escapeAttr(c.email)}">${escapeHtml(c.email)}</a>
      </div>`);

    sharedView.insertAdjacentHTML('beforeend', `
      <div class="cardmodal" style="margin:20px auto 0;text-align:left;max-width:420px;position:relative;">
        <div class="m-eyebrow">Danh thiếp</div>
        <div class="m-name">${escapeHtml(fullName(c))}</div>
        <div class="m-title">${escapeHtml(c.jobTitle || '')}</div>
        <div class="m-company">${escapeHtml(c.company || '')}</div>
        <div class="divider"></div>
        <div>${fields.join('') || '<div class="field" style="color:#8a8266">Không có thông tin liên hệ khác.</div>'}</div>
        <div class="actions">
          <button class="btn btn-primary" id="sharedVcfBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
            Tải lại VCF
          </button>
        </div>
      </div>
    `);

    document.getElementById('sharedVcfBtn').addEventListener('click', () => downloadVcf(c));

    showToast(`Đã tải danh thiếp của <b>${escapeHtml(fullName(c))}</b>`);
  }

  function closeModal(){
    backdrop.classList.remove('open');
    currentContact = null;
  }
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

  // ---- Tải VCF ----
  function buildVcf(c){
    return [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `N:${c.lastName};${c.firstName};;;`,
      `FN:${fullName(c)}`,
      c.company ? `ORG:${c.company}` : '',
      c.jobTitle ? `TITLE:${c.jobTitle}` : '',
      c.phone ? `TEL;TYPE=CELL:${c.phone}` : '',
      c.email ? `EMAIL:${c.email}` : '',
      'END:VCARD'
    ].filter(Boolean).join('\r\n');
  }

  function downloadVcf(c){
    const vcf = buildVcf(c);
    const blob = new Blob([vcf], {type:'text/vcard;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (fullName(c).replace(/\s+/g,'_') || c.id) + '.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  document.getElementById('vcfBtn').addEventListener('click', () => {
    if(!currentContact) return;
    downloadVcf(currentContact);
  });

  // ---- Copy link NFC ----
  document.getElementById('copyBtn').addEventListener('click', async () => {
    if(!currentContact) return;
    const link = buildNfcLink(currentContact.id);
    const btn = document.getElementById('copyBtn');
    try{
      await navigator.clipboard.writeText(link);
    } catch(e){
      const ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    const original = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> Đã copy';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = original; }, 1600);
  });

  function buildNfcLink(id){
    const url = new URL(location.href);
    url.search = '';
    url.searchParams.set('id', id);
    return url.toString();
  }

  // ---- Log lượt tap NFC ----
  function logNfcTap(id){
    if(!POST_URL) return;
    try{
      fetch(POST_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'nfc_tap', id, ts: new Date().toISOString() })
      }).catch(()=>{});
    } catch(e){ /* im lặng bỏ qua lỗi log */ }
  }

  loadContacts();
</script>
